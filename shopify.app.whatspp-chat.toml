# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "Messenger Linker"
client_id = "ba14e71219a0d25b11e496db975520f4"
application_url = "https://whatsapp-chat-six-psi.vercel.app"
embedded = true

[access_scopes]
scopes = "read_products,write_app_proxy"

[auth]
redirect_urls = [
  "https://whatsapp-chat-six-psi.vercel.app/auth/callback",
  "https://whatsapp-chat-six-psi.vercel.app/auth/shopify/callback",
  "https://whatsapp-chat-six-psi.vercel.app/api/auth/callback"
]

[webhooks]
api_version = "2024-01"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/webhooks"

[[webhooks.subscriptions]]
compliance_topics = [
  "customers/data_request",
  "customers/redact",
  "shop/redact"
]
uri = "/webhooks"

[extensions.theme]
handle = "whatsapp-extension"

[build]
automatically_update_urls_on_dev = true

[app_proxy]
url = "https://whatsapp-chat-six-psi.vercel.app"
subpath = "whatsapp-chat"
prefix = "apps"
